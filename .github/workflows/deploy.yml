name: Deploy Operations Dashboard

on:
  push:
    branches:
      - claude/sin-miedo-trading-dashboard-vs8Id
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sinmiedo-ops/package-lock.json

      - name: Install dependencies
        run: cd sinmiedo-ops && npm ci

      - name: Build
        run: cd sinmiedo-ops && npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./sinmiedo-ops/dist
