name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main, claude/sin-miedo-trading-dashboard-vs8Id]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sinmiedo-dashboard/package-lock.json

      - name: Build
        run: |
          cd sinmiedo-dashboard
          npm ci
          npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sinmiedo-dashboard/dist

      - uses: actions/deploy-pages@v4
        id: deployment
